name: 'Trivy Repository Security Scanner'
description: 'Centralized organization engine for DevOps/IaC scanning with automatic hotfix bypassing.'

runs:
  using: 'composite'
  steps:
    - name: ℹ️ Check for Hotfix Branch
      id: check-hotfix
      shell: bash
      run: |
        REF_NAME="${{ github.head_ref || github.ref_name }}"
        if [[ "$REF_NAME" =~ ^hotfix/ ]]; then
          echo "is_hotfix=true" >> $GITHUB_OUTPUT
          echo "🚀 Hotfix branch detected ($REF_NAME). Security engine will bypass scanning for this run."
        else
          echo "is_hotfix=false" >> $GITHUB_OUTPUT
        fi

    - name: 🛡️ Run Trivy Configuration Vulnerability Scanner
      if: steps.check-hotfix.outputs.is_hotfix != 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'config'
        hide-progress: false
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'

    - name: 📤 Upload Trivy Results to GitHub Security
      if: inputs.language == 'infrastructure' && steps.check-hotfix.outputs.is_hotfix != 'true' && always()
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: 'trivy-results.sarif'
        category: "/type:infrastructure"

    - name: ✅ Confirm Hotfix Bypass Execution
      if: steps.check-hotfix.outputs.is_hotfix == 'true'
      shell: bash
      run: echo "Bypass approved. Trivy scanning skipped to prevent blocking deployment workflows."
