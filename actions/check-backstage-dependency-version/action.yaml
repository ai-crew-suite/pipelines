name: 'Shared Weekly Version Bump Engine'
description: 'Centralized engine to execute backstage-cli framework upgrades and compile automated tracking pull requests'

inputs:
  node-version:
    description: 'The Node.js runtime version to initialize'
    required: false
    default: '22'
  workflow-github-token:
    description: 'A tracking token derived from an authorized GitHub App installation profile'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Encapsulated Workspace Checkout
      uses: actions/checkout@eef6142da74ffb929bfe9d0f6c17e3716e90a6cd # v4.2.1
      with:
        # Pass the authorized token directly to allow branch staging operations
        token: ${{ inputs.workflow-github-token }}
        fetch-depth: 0
        persist-credentials: true # Crucial: Allows downstream git steps to reuse the token safely

    - name: "🟢 Use Node.js ${{ inputs.node-version }}"
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "${{ inputs.node-version }}"
        cache: 'yarn'

    - name: Install Workspace Dependencies (Yarn 4 Immutable)
      shell: bash
      run: yarn install --immutable --inline-builds

    - name: Check Backstage Upstream Upgrades
      shell: bash
      run: yarn backstage-cli versions:bump

    - name: Automatically Orchestrate Branch and Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: "${{ inputs.workflow-github-token }}"
        commit-message: "chore(deps): update backstage and rag plugin dependencies"
        branch: "automated/update-dependencies"
        delete-branch: true
        title: "🔄 Update Core Dependencies & Upstream Framework"
        base: main
        body: |
          ### 🔄 Automated Backstage Dependency Upgrades
          This pull request updates our core framework modules and dependencies to align with the latest Backstage ecosystem release.

          - **Engine Hook**: Executed via `yarn backstage-cli versions:bump`
          - **Target Framework**: Managed under `@ai-crew-suite` workspaces

          *Automated thread dispatched securely via machine identity configuration parameters.*
        labels: |
          dependencies
          triage
        draft: false
