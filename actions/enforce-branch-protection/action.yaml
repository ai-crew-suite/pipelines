name: 'Validate Branch and PR Targets'
description: 'Centralized rules enforcing branch naming conventions and PR targets across AI Crew Suite with input sanitization'

inputs:
  head-ref:
    description: 'The source branch name (github.head_ref)'
    required: true
  base-ref:
    description: 'The target branch name (github.base_ref)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check branch naming convention
      shell: bash
      env:
        RAW_BRANCH_NAME: ${{ inputs.head-ref }}
      run: |
        : "${RAW_BRANCH_NAME:?head-ref input is required}"

        # Strict Sanitization: Allow only a safe character class for git branch references.
        # This strips out wildcards, semi-colons, backticks, spaces, or quotes.
        SANITIZED_BRANCH=$(echo "$RAW_BRANCH_NAME" | sed 's/[^a-zA-Z0-9./_-]//g')

        if [ "$RAW_BRANCH_NAME" != "$SANITIZED_BRANCH" ]; then
          echo "❌ Critical Security Error: Branch name contains illegal or unsafe characters."
          exit 1
        fi

        HUMAN_BRANCH_REGEX='^(bugfix|hotfix|feature|infrastructure|maintenance|content)/[a-z0-9-]+$'
        DEPENDABOT_BRANCH_REGEX='^dependabot/[a-z0-9._/-]+$'

        if [[ ! "$SANITIZED_BRANCH" =~ $HUMAN_BRANCH_REGEX && ! "$SANITIZED_BRANCH" =~ $DEPENDABOT_BRANCH_REGEX ]]; then
          echo "❌ Invalid branch name: $SANITIZED_BRANCH"
          echo ""
          echo "Branch names must follow one of these patterns:"
          echo "  - bugfix/<description>     (e.g., bugfix/fix-navigation-menu)"
          echo "  - hotfix/<description>     (e.g., hotfix/critical-security-patch)"
          echo "  - feature/<description>    (e.g., feature/add-contact-form)"
          echo "  - infrastructure/<desc>    (e.g., infrastructure/setup-ci)"
          echo "  - maintenance/<desc>       (e.g., maintenance/update-dependencies)"
          echo "  - content/<description>    (e.g., content/update-about-page)"
          echo "  - dependabot/<...>         (machine generated)"
          echo ""
          echo "For non-dependabot branches, use lowercase letters, numbers, and hyphens only."
          exit 1
        fi

        echo "✅ Branch name is valid: $SANITIZED_BRANCH"

    - name: Ensure PR targets main
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.base-ref }}
      run: |
        : "${TARGET_BRANCH:?base-ref input is required}"

        # Clean target branch name as well to maintain uniform security baselines
        SANITIZED_TARGET=$(echo "$TARGET_BRANCH" | sed 's/[^a-zA-Z0-9./_-]//g')

        if [ "$TARGET_BRANCH" != "$SANITIZED_TARGET" ]; then
          echo "❌ Critical Security Error: Target branch name contains illegal characters."
          exit 1
        fi

        if [ "$SANITIZED_TARGET" != "main" ]; then
          echo "⚠️ Warning: PR is targeting '$SANITIZED_TARGET' instead of 'main'"
          echo "This is allowed, but make sure this is intentional."
        else
          echo "✅ PR correctly targets 'main' branch"
        fi
