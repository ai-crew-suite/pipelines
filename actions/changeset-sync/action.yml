name: 'Mandatory Changeset Verification Engine'
description: 'Validates workspace tracking states to enforce strict audit documentation rules on PR scopes'

runs:
  using: 'composite'
  steps:
    - name: Audit Changeset Documentation Presence
      shell: bash
      run: |
        echo "================================================================"
        echo "🔍 Commencing Regulatory Change Control Verification..."
        echo "================================================================"

        # Pull changeset status cleanly
        if npx changeset status --since=origin/main > /dev/null 2>&1; then
          echo "✅ Compliance Check Passed: Human-vetted changeset file documented."
        else
          echo "❌ COMPLIANCE VIOLATION DETECTED"
          echo "--------------------------------------------------------"
          echo "Error: This pull request is missing a mandatory changeset file."
          echo "To satisfy FINRA, SOC-2, and HIPAA change control metrics, all"
          echo "code alterations must be explicitly documented."
          echo ""
          echo "Action Required:"
          echo "Please run 'yarn changeset' locally on your workstation to describe"
          echo "your modifications, and commit the generated file to this branch."
          echo "--------------------------------------------------------"
          exit 1 # Hard fail: Immediately locks the PR from merging
        fi
